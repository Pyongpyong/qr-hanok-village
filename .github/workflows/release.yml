# Same main-branch / Conventional Commits release model as useless-buttons.
# Enable NPM_PUBLISH_ENABLED=true only after npm Trusted Publishing is configured.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Ensure npm Trusted Publishing support
        run: npm install -g npm@latest
      - run: npm ci
      - name: Plan version and check npm registry
        id: plan
        run: node scripts/release-plan.mjs
      - run: npm run check
      - name: Commit version and push release tag
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" != "none" ]; then
            git add package.json package-lock.json
            git commit -m "chore(release): v$VERSION"
          fi
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin HEAD:main "refs/tags/v$VERSION"
          fi
      - name: Publish to npm via OIDC
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --generate-notes --verify-tag
          fi
